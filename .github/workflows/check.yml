name: Kiem Tra Gia Han Domain

on:
  schedule:
    # 01:00 UTC = 08:00 sáng giờ Việt Nam (UTC+7)
    - cron: '0 1 * * *'
  # Cho phép bấm nút test thủ công bất kỳ lúc nào
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy kiểm tra và gửi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
